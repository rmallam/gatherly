name: Android CI/CD

permissions:
  contents: write

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci --legacy-peer-deps
    
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
    
    - name: Sync Capacitor
      working-directory: ./frontend
      run: npx cap sync android
    
    - name: Grant execute permission for gradlew
      working-directory: ./frontend/android
      run: chmod +x gradlew
    
    # --- DEBUG APK (For Branches and PRs) ---
    - name: Build Android Debug APK
      if: startsWith(github.ref, 'refs/tags/v') != true
      working-directory: ./frontend/android
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Upload APK artifact
      if: startsWith(github.ref, 'refs/tags/v') != true
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-${{ github.sha }}
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
    
    # --- SIGNED AAB (For Version Tags ONLY) ---
    - name: Setup Keystore and Properties
      if: startsWith(github.ref, 'refs/tags/v')
      working-directory: ./frontend/android
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> gradle.properties
        echo "MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> gradle.properties
        echo "MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> gradle.properties
        echo "MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> gradle.properties
        
    - name: Update Version Code and Name
      if: startsWith(github.ref, 'refs/tags/v')
      working-directory: ./frontend/android
      run: |
        # Extract version name from the tag (e.g., refs/tags/v1.0.1 -> 1.0.1)
        VERSION_NAME=${GITHUB_REF#refs/tags/v}
        # Calculate a monotonically increasing version code using the github run number.
        # We offset by 100 to ensure it is higher than your current versionCode (36).
        VERSION_CODE=$(( 100 + ${{ github.run_number }} ))
        
        echo "Setting versionName to $VERSION_NAME"
        echo "Setting versionCode to $VERSION_CODE"
        
        # Replace versions in build.gradle
        sed -i "s/versionCode .*/versionCode $VERSION_CODE/g" app/build.gradle
        sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/g" app/build.gradle
        
    - name: Build Android Signed AAB
      if: startsWith(github.ref, 'refs/tags/v')
      working-directory: ./frontend/android
      run: ./gradlew bundleRelease --stacktrace
    
    - name: Upload AAB artifact
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: app-release-${{ github.ref_name }}
        path: frontend/android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: frontend/android/app/build/outputs/bundle/release/app-release.aab
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # --- GOOGLE PLAY STORE UPLOAD ---
    # To enable automatic Play Store uploads, uncomment the following block
    # and add a new GitHub Secret called PLAYSTORE_SERVICE_ACCOUNT_JSON
    # containing the JSON key of a Google Cloud Service Account with Play Console permissions.
