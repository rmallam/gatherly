    #   uses: r0adkll/upload-google-play@v1
    #   with:
    #     serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
    #     packageName: com.hosteze.app
    #     releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
    #     track: production # or internal, alpha, beta
    #     status: completed
