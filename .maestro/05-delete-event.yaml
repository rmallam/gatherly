appId: com.guestscanner.app
---
# Test: Delete Event
- launchApp:
    clearState: true

# Handle notification permission if it appears
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

# Login first
# Enter email
- tapOn: 
    text: "your@email.com"
- inputText: "testuser@test.com"
- waitForAnimationToEnd

# Enter password
- tapOn:
    text: "Enter your password"
- inputText: "Test@1234"
- waitForAnimationToEnd

# Submit login
- tapOn: "Sign In"
# Handle new Welcome Tour overlay
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd

- waitForAnimationToEnd

# Wait for dashboard to load
- extendedWaitUntil:
    visible: "My Events"
    timeout: 10000
- waitForAnimationToEnd

# Create event
- tapOn: "New Event"
- waitForAnimationToEnd
- assertVisible: "Event Title"
- tapOn:
    text: "e.g. Annual Conference 2024"
- inputText: "Event to Delete"
- tapOn: "Create Event"
- waitForAnimationToEnd

# Should see event in list
- assertVisible: "Event to Delete"
- waitForAnimationToEnd

# Open the event to access delete button
- tapOn: "Event to Delete"
- waitForAnimationToEnd

# Wait for event details page to load
- extendedWaitUntil:
    visible: "Overview"
    timeout: 10000
- waitForAnimationToEnd

# Tap the delete button (trash icon in header) - use id selector
- tapOn:
    id: "delete-event-button"
- waitForAnimationToEnd

# Wait for confirmation modal to appear
- extendedWaitUntil:
    visible: "Delete Event?"
    timeout: 10000
- waitForAnimationToEnd

# Wait a bit more for modal to fully render
- waitForAnimationToEnd

# Wait for the Delete Event button text to be visible (confirms modal is ready)
- extendedWaitUntil:
    visible: "Delete Event"
    timeout: 10000
- waitForAnimationToEnd

# Confirm deletion - tap using ID selector (most reliable)
- tapOn:
    id: "confirm-delete-event-button"
- waitForAnimationToEnd

# Wait for navigation back to dashboard
- extendedWaitUntil:
    visible: "My Events"
    timeout: 10000
- waitForAnimationToEnd

# Event should be gone from the list
- assertNotVisible: "Event to Delete"

# Success!
